<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* === CSS APLIKASI UTAMA === */
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .app-container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 5px; }

        /* Tabel Data & Form - Dibuat Responsive (Bisa digeser horizontal) */
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        
        /* Tombol Aksi Tabel */
        .btn-edit { padding: 5px; background: #FFC107; color: black; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;}
        .btn-hapus { padding: 5px; background: #f44336; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;}
        .btn-file { padding: 4px 8px; background: #2196F3; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; text-decoration: none;}
        
        /* Tombol Toolbar Atas */
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap;}
        .btn-toolbar { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-tambah { background: #4CAF50; }
        .btn-sortir { background: #9C27B0; cursor: pointer; font-family: inherit; font-size: 14px; outline: none;}    
        .btn-template { background: #2196F3; } 
        .btn-excel { background: #1b7339; }    
        .btn-hapus-massal { background: #f44336; } 
        
        /* Form dalam Modal */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px;}
        .form-group input[type="text"], .form-group select, .form-group input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .file-info { font-size: 11px; color: red; margin-top: 3px; }
        
        /* === CSS MODAL (POP-UP FORM) - Dibuat Scrollable === */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: #fff; margin: 2% auto; padding: 20px; border-radius: 8px; width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; position: sticky; top: 0; background: #fff; padding-bottom: 10px; border-bottom: 1px solid #eee;}
        .close-btn { cursor: pointer; color: red; font-weight: bold; font-size: 20px;}
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; position: sticky; bottom: 0; background: #fff; padding-top: 10px; border-top: 1px solid #eee;}
        .btn-batal { background: #ccc; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;}
        .btn-simpan { padding: 10px 15px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container" id="app-container">
    <h2>Data Lengkap Siswa</h2>
    
    <div class="toolbar">
        <button class="btn-toolbar btn-tambah" onclick="bukaModalForm()">➕ Tambah Siswa</button>
        
        <select class="btn-toolbar btn-sortir" id="filter-kelas" onchange="renderTabel()">
            <option value="semua" style="color: black;">🔃 Filter Kelas (Semua)</option>
            <option value="1" style="color: black;">Kelas 1</option>
            <option value="2" style="color: black;">Kelas 2</option>
            <option value="3" style="color: black;">Kelas 3</option>
            <option value="4" style="color: black;">Kelas 4</option>
            <option value="5" style="color: black;">Kelas 5</option>
            <option value="6" style="color: black;">Kelas 6</option>
        </select>

        <button class="btn-toolbar btn-excel" onclick="document.getElementById('inputExcel').click()">📊 Impor dari Excel</button>
        <input type="file" id="inputExcel" accept=".xlsx, .xls" style="display: none;" onchange="prosesImporExcel(event)">
        
        <button class="btn-toolbar btn-template" onclick="downloadTemplateExcel()">⬇️ Download Template</button>
        <button class="btn-toolbar btn-hapus-massal" onclick="hapusTerpilih()">🗑️ Hapus Terpilih</button>
    </div>

    <!-- Wrapper agar tabel bisa digeser ke samping -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="width: 30px; text-align: center;">
                        <input type="checkbox" id="check-all" onclick="toggleSelectAll(this)" title="Pilih Semua">
                    </th>
                    <th style="text-align: center;">No.</th>
                    <th>Nama Lengkap</th>
                    <th>NISN</th>
                    <th>NIK</th>
                    <th>Kelas</th>
                    <th>Tempat, Tgl Lahir</th>
                    <th>L/P</th>
                    <th>Agama</th>
                    <th>Alamat Lengkap</th>
                    <th>No. KK</th>
                    <th>Nama Ayah & Ibu</th>
                    <th>Pekerjaan Ortu</th>
                    <th>No. HP Ortu</th>
                    <th>Pas Foto</th>
                    <th>Akta</th>
                    <th>KK</th>
                    <th style="text-align:center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="tabel-body">
                <!-- Data akan dimuat otomatis -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Tambah / Edit Siswa -->
<div id="modalForm" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modal-judul">Tambah Siswa</span>
            <span class="close-btn" onclick="tutupModalForm()">&times;</span>
        </div>
        
        <input type="hidden" id="form-index" value=""> 
        
        <!-- Field Teks -->
        <div class="form-group"><label>Nama Lengkap:</label><input type="text" id="form-nama" autocomplete="off"></div>
        <div class="form-group"><label>NISN:</label><input type="text" id="form-nisn" autocomplete="off"></div>
        <div class="form-group"><label>NIK:</label><input type="text" id="form-nik" autocomplete="off"></div>
        <div class="form-group"><label>Kelas:</label><input type="text" id="form-kelas" autocomplete="off" placeholder="Contoh: 1, otomatis jadi 1 (Satu)"></div>
        <div class="form-group"><label>Tempat, Tanggal Lahir:</label><input type="text" id="form-ttl" autocomplete="off" placeholder="Contoh: Lamongan, 12 Agustus 2010"></div>
        
        <div class="form-group">
            <label>Jenis Kelamin (L/P):</label>
            <select id="form-jk">
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
        </div>
        
        <div class="form-group"><label>Agama:</label><input type="text" id="form-agama" autocomplete="off" value="Islam"></div>
        <div class="form-group"><label>Alamat Lengkap:</label><input type="text" id="form-alamat" autocomplete="off"></div>
        <div class="form-group"><label>Nomor KK:</label><input type="text" id="form-kk" autocomplete="off"></div>
        <div class="form-group"><label>Nama Ayah & Ibu:</label><input type="text" id="form-ortu" autocomplete="off" placeholder="Ayah: ... / Ibu: ..."></div>
        <div class="form-group"><label>Pekerjaan Orang Tua:</label><input type="text" id="form-pekerjaan" autocomplete="off"></div>
        <div class="form-group"><label>Nomor HP Orang Tua:</label><input type="text" id="form-hp" autocomplete="off"></div>

        <hr style="margin: 20px 0; border: 0.5px solid #ddd;">
        
        <!-- Field Upload Berkas -->
        <div class="form-group">
            <label>Pas Foto:</label>
            <input type="file" id="form-foto" accept="image/*" onchange="encodeFile(this, 'hidden-foto')">
            <div class="file-info">*Maksimal 2MB (Format: JPG/PNG)</div>
            <input type="hidden" id="hidden-foto">
        </div>
        <div class="form-group">
            <label>Akta Kelahiran:</label>
            <input type="file" id="form-akta" accept="image/*,.pdf" onchange="encodeFile(this, 'hidden-akta')">
            <div class="file-info">*Maksimal 2MB (Format: JPG/PNG/PDF)</div>
            <input type="hidden" id="hidden-akta">
        </div>
        <div class="form-group">
            <label>Kartu Keluarga (KK):</label>
            <input type="file" id="form-filekk" accept="image/*,.pdf" onchange="encodeFile(this, 'hidden-filekk')">
            <div class="file-info">*Maksimal 2MB (Format: JPG/PNG/PDF)</div>
            <input type="hidden" id="hidden-filekk">
        </div>

        <div class="modal-footer">
            <button class="btn-batal" onclick="tutupModalForm()">Batal</button>
            <button class="btn-simpan" onclick="simpanSiswa()">Simpan Data</button>
        </div>
    </div>
</div>

<script type="module">
    // Import SDK Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
    import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyCae3CoI4eWy9T6yhf_yGvoHiyoAJ7gUyA",
        authDomain: "datasiswa-65abf.firebaseapp.com",
        databaseURL: "https://datasiswa-65abf-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "datasiswa-65abf",
        storageBucket: "datasiswa-65abf.firebasestorage.app",
        messagingSenderId: "1043621527533",
        appId: "1:1043621527533:web:3e854e6c862709002731e4",
        measurementId: "G-D6YZGM4KT5"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    window.dataPeserta = [];
    window.dataKeys = [];

    // Listener Real-time Firebase
    const siswaRef = ref(db, 'siswa');
    onValue(siswaRef, (snapshot) => {
        const data = snapshot.val();
        window.dataPeserta = [];
        window.dataKeys = [];
        
        if (data) {
            let tempArr = [];
            Object.keys(data).forEach(key => {
                tempArr.push({ id: key, data: data[key] });
            });

            // LOGIKA PENGURUTAN (SORT) SPESIFIK PADA "NAMA LENGKAP" (A-Z)
            tempArr.sort((a, b) => {
                // String() dan trim() digunakan agar spasi kosong di awal nama yang mungkin terketik dari Excel diabaikan
                let namaA = String(a.data.nama || "").trim().toUpperCase();
                let namaB = String(b.data.nama || "").trim().toUpperCase();
                
                if (namaA < namaB) return -1;
                if (namaA > namaB) return 1;
                return 0;
            });

            // Kembalikan ke array utama setelah disortir
            tempArr.forEach(item => {
                window.dataKeys.push(item.id);
                window.dataPeserta.push(item.data);
            });
        }
        window.renderTabel();
    });

    // --- FUNGSI FORMAT KELAS: 1 -> 1 (Satu) ---
    window.formatKelasBaku = function(input) {
        let str = String(input || "").trim();
        str = str.replace(/kelas/i, "").trim();
        
        const mapKata = {
            "1": "Satu", "2": "Dua", "3": "Tiga",
            "4": "Empat", "5": "Lima", "6": "Enam"
        };

        const match = str.match(/\d+/);
        if (match) {
            let num = match[0];
            if (mapKata[num]) {
                if (!str.toLowerCase().includes(mapKata[num].toLowerCase())) {
                    str = str.replace(num, `${num} (${mapKata[num]}) `).trim();
                }
            }
        }
        return str;
    }

    // --- FUNGSI MEMBACA FILE MENJADI BASE64 ---
    window.encodeFile = function(element, hiddenId) {
        const file = element.files[0];
        if (file) {
            if(file.size > 2 * 1024 * 1024) {
                alert("Gagal: Ukuran file terlalu besar! Maksimal 2MB per file.");
                element.value = ""; 
                document.getElementById(hiddenId).value = "";
                return;
            }
            const reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById(hiddenId).value = reader.result;
            }
            reader.readAsDataURL(file);
        } else {
            document.getElementById(hiddenId).value = "";
        }
    }

    // --- FUNGSI MEMBUKA FILE DI TAB BARU ---
    window.bukaFile = function(base64String) {
        if(!base64String) return;
        const newWindow = window.open();
        if(newWindow) {
            if(base64String.startsWith("data:image")) {
                newWindow.document.write(`<img src="${base64String}" style="max-width:100%;">`);
            } else {
                newWindow.document.write(`<iframe src="${base64String}" width="100%" height="100%" style="border:none;"></iframe>`);
            }
        }
    }

    // Fungsi Render Tabel
    window.renderTabel = function() {
        const tbody = document.getElementById("tabel-body");
        tbody.innerHTML = "";
        
        const checkAll = document.getElementById("check-all");
        if(checkAll) checkAll.checked = false;
        
        const filterValue = document.getElementById("filter-kelas").value;
        let nomorUrut = 1;

        window.dataPeserta.forEach((p, index) => {
            let tampilkan = true;
            let displayKelas = window.formatKelasBaku(p.kelas);
            
            if (filterValue !== "semua") {
                const matchNumber = displayKelas.match(/\d+/);
                const classNumber = matchNumber ? matchNumber[0] : "";
                if (classNumber !== filterValue) tampilkan = false;
            }

            if (tampilkan) {
                const btnFoto = p.foto ? `<button class="btn-file" onclick="bukaFile('${p.foto}')">Lihat</button>` : `-`;
                const btnAkta = p.akta ? `<button class="btn-file" onclick="bukaFile('${p.akta}')">Lihat</button>` : `-`;
                const btnKK = p.filekk ? `<button class="btn-file" onclick="bukaFile('${p.filekk}')">Lihat</button>` : `-`;

                const tr = `<tr>
                    <td style="text-align: center;">
                        <input type="checkbox" class="check-item" value="${index}">
                    </td>
                    <td style="text-align: center;">${nomorUrut}</td>
                    <td>${p.nama || ''}</td>
                    <td>${p.nisn || ''}</td>
                    <td>${p.nik || ''}</td>
                    <td>${displayKelas}</td>
                    <td>${p.ttl || ''}</td>
                    <td>${p.jk || ''}</td>
                    <td>${p.agama || ''}</td>
                    <td>${p.alamat || ''}</td>
                    <td>${p.kk || ''}</td>
                    <td>${p.ortu || ''}</td>
                    <td>${p.pekerjaan || ''}</td>
                    <td>${p.hp || ''}</td>
                    <td style="text-align: center;">${btnFoto}</td>
                    <td style="text-align: center;">${btnAkta}</td>
                    <td style="text-align: center;">${btnKK}</td>
                    <td style="text-align:center;">
                        <button class="btn-edit" onclick="bukaModalForm(${index})" title="Edit Data">✏️</button>
                        <button class="btn-hapus" onclick="hapusSiswa(${index})" title="Hapus Data">🗑️</button>
                    </td>
                </tr>`;
                tbody.innerHTML += tr;
                nomorUrut++;
            }
        });
    }

    window.toggleSelectAll = function(source) {
        const checkboxes = document.querySelectorAll('.check-item');
        checkboxes.forEach(cb => cb.checked = source.checked);
    }

    window.hapusTerpilih = function() {
        const checkboxes = document.querySelectorAll('.check-item:checked');
        if (checkboxes.length === 0) {
            alert("Silakan pilih/centang data yang ingin dihapus terlebih dahulu!");
            return;
        }

        if(confirm(`Yakin menghapus ${checkboxes.length} data siswa secara permanen?`)) {
            checkboxes.forEach(cb => {
                const key = window.dataKeys[cb.value];
                if (key) remove(ref(db, `siswa/${key}`)); 
            });
            document.getElementById('check-all').checked = false;
        }
    }

    window.bukaModalForm = function(index = null) {
        document.getElementById('modalForm').style.display = 'block';
        
        document.getElementById('form-foto').value = '';
        document.getElementById('form-akta').value = '';
        document.getElementById('form-filekk').value = '';

        if(index !== null) {
            document.getElementById('modal-judul').innerText = "Edit Siswa";
            document.getElementById('form-index').value = index;
            
            const p = window.dataPeserta[index];
            document.getElementById('form-nama').value = p.nama || '';
            document.getElementById('form-nisn').value = p.nisn || '';
            document.getElementById('form-nik').value = p.nik || '';
            document.getElementById('form-kelas').value = window.formatKelasBaku(p.kelas);
            document.getElementById('form-ttl').value = p.ttl || '';
            document.getElementById('form-jk').value = p.jk || 'Laki-laki';
            document.getElementById('form-agama').value = p.agama || 'Islam';
            document.getElementById('form-alamat').value = p.alamat || '';
            document.getElementById('form-kk').value = p.kk || '';
            document.getElementById('form-ortu').value = p.ortu || '';
            document.getElementById('form-pekerjaan').value = p.pekerjaan || '';
            document.getElementById('form-hp').value = p.hp || '';
            
            document.getElementById('hidden-foto').value = p.foto || '';
            document.getElementById('hidden-akta').value = p.akta || '';
            document.getElementById('hidden-filekk').value = p.filekk || '';
        } else {
            document.getElementById('modal-judul').innerText = "Tambah Siswa Baru";
            document.getElementById('form-index').value = "";
            document.getElementById('form-nama').value = "";
            document.getElementById('form-nisn').value = "";
            document.getElementById('form-nik').value = "";
            document.getElementById('form-kelas').value = "";
            document.getElementById('form-ttl').value = "";
            document.getElementById('form-jk').value = "Laki-laki";
            document.getElementById('form-agama').value = "Islam";
            document.getElementById('form-alamat').value = "";
            document.getElementById('form-kk').value = "";
            document.getElementById('form-ortu').value = "";
            document.getElementById('form-pekerjaan').value = "";
            document.getElementById('form-hp').value = "";
            
            document.getElementById('hidden-foto').value = "";
            document.getElementById('hidden-akta').value = "";
            document.getElementById('hidden-filekk').value = "";
        }
    }

    window.tutupModalForm = function() { document.getElementById('modalForm').style.display = 'none'; }

    window.simpanSiswa = function() {
        const index = document.getElementById('form-index').value;
        const inputNama = String(document.getElementById('form-nama').value).trim().toUpperCase();
        
        if(inputNama === "") { 
            alert("Nama Lengkap tidak boleh kosong!"); 
            return; 
        }

        const dataBaru = {
            nama: inputNama,
            nisn: document.getElementById('form-nisn').value,
            nik: document.getElementById('form-nik').value,
            kelas: window.formatKelasBaku(document.getElementById('form-kelas').value),
            ttl: document.getElementById('form-ttl').value,
            jk: document.getElementById('form-jk').value,
            agama: document.getElementById('form-agama').value,
            alamat: document.getElementById('form-alamat').value,
            kk: document.getElementById('form-kk').value,
            ortu: document.getElementById('form-ortu').value,
            pekerjaan: document.getElementById('form-pekerjaan').value,
            hp: document.getElementById('form-hp').value,
            foto: document.getElementById('hidden-foto').value,
            akta: document.getElementById('hidden-akta').value,
            filekk: document.getElementById('hidden-filekk').value
        };

        if(index === "") {
            const newSiswaRef = push(ref(db, 'siswa'));
            set(newSiswaRef, dataBaru);
        } else {
            const key = window.dataKeys[index];
            set(ref(db, `siswa/${key}`), dataBaru);
        }
        
        window.tutupModalForm(); 
    }

    window.hapusSiswa = function(index) {
        if(confirm(`Yakin ingin menghapus data ${window.dataPeserta[index].nama}?`)) {
            const key = window.dataKeys[index];
            remove(ref(db, `siswa/${key}`));
        }
    }

    // --- FUNGSI EXCEL DOWNLOAD TEMPLATE ---
    window.downloadTemplateExcel = function() {
        const dataTemplate = [
            ["Nama Lengkap", "NISN", "NIK", "Kelas", "Tempat, Tgl Lahir", "L/P", "Agama", "Alamat Lengkap", "No. KK", "Nama Ayah & Ibu", "Pekerjaan Ortu", "No. HP Ortu"],
            ["CONTOH NAMA SISWA", "1234567890", "3524000000", "1", "Lamongan, 17 Agustus 2010", "Laki-laki", "Islam", "Jl. Merdeka No 1", "3524111111", "Budi / Wati", "Petani", "08123456789"]
        ];
        const workbook = window.XLSX.utils.book_new();
        const worksheet = window.XLSX.utils.aoa_to_sheet(dataTemplate);
        worksheet['!cols'] = [ {wch: 30}, {wch: 15}, {wch: 20}, {wch: 10}, {wch: 25}, {wch: 12}, {wch: 10}, {wch: 30}, {wch: 20}, {wch: 25}, {wch: 15}, {wch: 15} ];
        
        window.XLSX.utils.book_append_sheet(workbook, worksheet, "Data_Siswa");
        window.XLSX.writeFile(workbook, "Template_Data_Siswa.xlsx");
    }

    // --- FUNGSI IMPOR EXCEL ---
    window.prosesImporExcel = function(event) {
        const file = event.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = window.XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const jsonSheet = window.XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName], {raw: false});
            
            let berhasil = 0;

            jsonSheet.forEach(row => {
                const keys = Object.keys(row);
                const getVal = (keywords) => {
                    const matchKey = keys.find(k => keywords.some(word => k.toLowerCase().includes(word)));
                    return matchKey ? row[matchKey] : "";
                };

                const nama = getVal(["nama"]);
                if(nama) { 
                    const newSiswaRef = push(ref(db, 'siswa'));
                    set(newSiswaRef, {
                        // Pastikan nama di-trim (hapus spasi kosong) agar rapi saat disortir A-Z
                        nama: String(nama).trim().toUpperCase(), 
                        nisn: getVal(["nisn"]) || "", 
                        nik: getVal(["nik"]) || "", 
                        kelas: window.formatKelasBaku(getVal(["kelas", "kls"])),
                        ttl: getVal(["tempat", "tgl", "lahir"]) || "",
                        jk: getVal(["l/p", "jenis", "kelamin"]) || "",
                        agama: getVal(["agama"]) || "",
                        alamat: getVal(["alamat"]) || "",
                        kk: getVal(["kk", "kartu"]) || "",
                        ortu: getVal(["ayah", "ibu", "ortu"]) || "",
                        pekerjaan: getVal(["pekerjaan", "kerja"]) || "",
                        hp: getVal(["hp"]) || "",
                        foto: "", akta: "", filekk: "" 
                    });
                    berhasil++;
                }
            });

            alert(`Selesai! Berhasil mengirimkan ${berhasil} data siswa dari Excel ke Firebase.\nData otomatis diurutkan sesuai abjad pada kolom Nama Lengkap.`);
            document.getElementById('inputExcel').value = ""; 
        };
        reader.readAsArrayBuffer(file);
    }
</script>
